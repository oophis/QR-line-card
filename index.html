<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff3e6">
  <!-- การ์ดเป็นของส่วนตัว ไม่ควรถูก search engine เก็บ -->
  <meta name="robots" content="noindex, nofollow">
  <title>LINE QR Card</title>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand" id="brand">LINE QR Card</div>
      <div class="counter" id="counter"></div>
    </header>

    <div class="stage" id="stage">
      <div class="card-frame">
        <div class="viewport" id="viewport"></div>
        <button type="button" class="corner-nav corner-prev" id="prev" aria-label="ก่อนหน้า">
          <span aria-hidden="true">‹</span>
        </button>
        <button type="button" class="corner-nav corner-next" id="next" aria-label="ถัดไป">
          <span aria-hidden="true">›</span>
        </button>
      </div>
    </div>

    <nav class="dotsbar" id="nav">
      <div class="dots" id="dots"></div>
    </nav>
  </main>

  <script src="assets/card-data.js"></script>
  <script src="assets/storage.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
